<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Awesome SwiftUI Components">
  <title>Awesome SwiftUI Components</title>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9F0A"/>
      <stop offset="0.5" stop-color="#FF375F"/>
      <stop offset="1" stop-color="#BF5AF2"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .block { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .block { animation: settle 5s cubic-bezier(0.3, 1.4, 0.5, 1) infinite; }
      .two { animation-delay: 0.14s; }
      .three { animation-delay: 0.28s; }
    }
    @keyframes settle {
      0%, 6% { opacity: 0; transform: translateY(14px) scale(0.86); }
      16%, 88% { opacity: 1; transform: none; }
      96%, 100% { opacity: 0; transform: translateY(-8px) scale(0.96); }
    }
  </style>
  <rect x="8" y="8" width="144" height="144" rx="36" fill="url(#face)"/>
  <rect x="8" y="8" width="144" height="144" rx="36" fill="url(#gloss)"/>
  <rect class="block" x="38" y="38" width="84" height="28" rx="14" fill="#FFFFFF"/>
  <rect class="block two" x="38" y="76" width="50" height="46" rx="14" fill="#FFFFFF" opacity="0.88"/>
  <rect class="block three" x="98" y="76" width="24" height="46" rx="12" fill="#FFFFFF" opacity="0.66"/>
</svg>
