<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 24 580 172" width="580" height="172" role="img" aria-label="Browse the catalog">
  <title>Browse the catalog</title>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#FF9F0A"/>
      <stop offset="0.36" stop-color="#FF375F"/>
      <stop offset="0.72" stop-color="#BF5AF2"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="pill"><rect x="110" y="60" width="500" height="96" rx="48"/></clipPath>
  </defs>
  <style>
    .label { font: 800 34px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .glow, .ring, .arrow { transform-box: fill-box; transform-origin: center; }
    .shine { transform: translateX(-200px); }
    @media (prefers-reduced-motion: reduce) {
      .shine { display: none; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .glow { animation: glow 2.8s ease-in-out infinite; }
      .ring { animation: ring 2.8s ease-out infinite; }
      .shine { animation: shine 3.6s cubic-bezier(0.4, 0, 0.3, 1) infinite; }
      .arrow { animation: nudge 1.4s ease-in-out infinite; }
    }
    @keyframes glow { 50% { opacity: 0.95; transform: scale(1.03); } }
    @keyframes ring { from { opacity: 0.7; transform: scale(1); } 70%, to { opacity: 0; transform: scale(1.07, 1.3); } }
    @keyframes shine { from { transform: translateX(-200px); } 60%, to { transform: translateX(720px); } }
    @keyframes nudge { 50% { transform: translateX(6px); } }
  </style>

  <rect class="glow" x="118" y="70" width="484" height="92" rx="46" fill="#FF5E7E" opacity="0.6" filter="url(#blur)"/>
  <rect class="ring" x="110" y="60" width="500" height="96" rx="48" fill="none" stroke="#FF7A6B" stroke-width="3" opacity="0"/>

  <rect x="110" y="68" width="500" height="96" rx="48" fill="#7A2A8F"/>
  <rect x="110" y="60" width="500" height="96" rx="48" fill="url(#face)"/>
  <rect x="110" y="60" width="500" height="96" rx="48" fill="url(#gloss)"/>
  <g clip-path="url(#pill)"><rect class="shine" x="0" y="40" width="170" height="140" fill="url(#shine)" transform="skewX(-18)"/></g>

  <text class="label" x="150" y="120" textLength="330" lengthAdjust="spacingAndGlyphs">Browse the catalog</text>
  <g class="arrow">
    <circle cx="556" cy="108" r="30" fill="#FFFFFF"/>
    <path d="M543 108h24m-10-11 11 11-11 11" fill="none" stroke="#BF5AF2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
