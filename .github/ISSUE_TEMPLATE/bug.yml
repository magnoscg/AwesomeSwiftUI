name: Bug report
description: A component does something wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting it. A security problem goes in a private report instead, as SECURITY.md explains.
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Buttons/PressableButtonStyle
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: iOS and Xcode versions
      placeholder: iOS 27.2 on an iPhone 15 Pro, Xcode 27.2
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to see it
      description: The steps that show the problem, and a small snippet if it helps.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
